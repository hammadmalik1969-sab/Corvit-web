<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cafe Digital Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

  <h1 class="text-3xl font-bold text-center mb-8">
    🍔 Cafe Menu
  </h1>

  <!-- ☕ Menu Container -->
  <div class="flex flex-wrap gap-6 justify-center">

    <!-- 🍟 Item -->
    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Burger</h2>
      <p class="text-gray-600">Juicy beef burger</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Pizza</h2>
      <p class="text-gray-600">Cheesy pizza slice</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Fries</h2>
      <p class="text-gray-600">Crispy french fries</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Sandwich</h2>
      <p class="text-gray-600">Fresh club sandwich</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Shawarma</h2>
      <p class="text-gray-600">Chicken shawarma</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Nuggets</h2>
      <p class="text-gray-600">Crispy nuggets</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Hot Dog</h2>
      <p class="text-gray-600">Classic hot dog</p>
    </div>

    <div class="basis-[250px] bg-white p-4 rounded-xl shadow">
      <h2 class="font-bold text-lg">Cold Drink</h2>
      <p class="text-gray-600">Refreshing beverage</p>
    </div>

  </div>

</body>
</html>
