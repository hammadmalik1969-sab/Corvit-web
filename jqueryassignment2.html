<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-3">Shopping List</h2>
    
    <!-- Input and Button -->
    <div class="input-group mb-3">
      <input type="text" id="itemInput" class="form-control" placeholder="Enter an item">
      <button id="addBtn" class="btn btn-primary">Add to Bag</button>
    </div>

    <!-- List -->
    <ul id="shoppingList" class="list-group">
      <!-- New items will be appended here -->
    </ul>
  </div>

  <script>
    $(document).ready(function() {
      // Add button click
      $('#addBtn').click(function() {
        let item = $('#itemInput').val().trim(); // Get input value and remove extra spaces
        if(item !== '') {
          // Create new list item with Delete button
          let listItem = $(`
            <li class="list-group-item d-flex justify-content-between align-items-center">
              ${item}
              <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
            </li>
          `);
          $('#shoppingList').append(listItem); // Add to the list
          $('#itemInput').val(''); // Clear input box
        }
      });

      // Delete button click (using event delegation)
      $('#shoppingList').on('click', '.deleteBtn', function() {
        $(this).parent().remove(); // Remove the specific li
      });
    });
  </script>

</body>
</html>
